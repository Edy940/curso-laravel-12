services:
  app:
    build:
      context: ./docker
    container_name: curso_laravel
    volumes:
      - .:/var/www/html:cached
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000
